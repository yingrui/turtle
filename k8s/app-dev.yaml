# Dev Deployments for openKMS kubernetes dev-sync (hot reload).
# Separate from published App Services (backend / frontend in app.yaml).
# Apply after stock-config + stock-secrets exist (see app.yaml).
#
# Sync examples:
#   kubernetes dev-sync --deployment backend-dev \
#     --local-path backend/app --container-path /app/backend/app --reload --yes
#   kubernetes dev-sync --deployment frontend-dev \
#     --local-path frontend/src --container-path /src/src --reload --yes
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-dev
  namespace: stock
  labels:
    app: backend-dev
    app.kubernetes.io/part-of: turtle
    app.kubernetes.io/component: hot-reload
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend-dev
  template:
    metadata:
      labels:
        app: backend-dev
    spec:
      containers:
        - name: backend
          image: turtle-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8200
              name: http
          envFrom:
            - configMapRef:
                name: stock-config
            - secretRef:
                name: stock-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: logs
              mountPath: /app/logs
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: backend-dev
  namespace: stock
  labels:
    app: backend-dev
    app.kubernetes.io/part-of: turtle
spec:
  selector:
    app: backend-dev
  ports:
    - name: http
      port: 8200
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-dev
  namespace: stock
  labels:
    app: frontend-dev
    app.kubernetes.io/part-of: turtle
    app.kubernetes.io/component: hot-reload
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: frontend-dev
  template:
    metadata:
      labels:
        app: frontend-dev
    spec:
      containers:
        - name: frontend
          image: turtle-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3200
              name: http
          env:
            - name: VITE_BASE
              value: "./"
            - name: VITE_PROXY_TARGET
              value: http://backend-dev:8200
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 12
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-dev
  namespace: stock
  labels:
    app: frontend-dev
    app.kubernetes.io/part-of: turtle
spec:
  selector:
    app: frontend-dev
  ports:
    - name: http
      port: 3200
      targetPort: http
