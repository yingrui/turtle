# Combined manifests for openKMS: kubernetes apply --file k8s/app.yaml --namespace stock
# Prerequisites:
#   kubectl apply -f k8s/namespace.yaml
#   Secret stock-secrets in namespace stock (create in cluster; not in this repo)
#     keys: STOCK_DATABASE_PASSWORD, STOCK_SECRET_KEY, TUSHARE_TOKEN
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: stock-config
  namespace: stock
  labels:
    app.kubernetes.io/part-of: turtle
data:
  STOCK_DATABASE_HOST: host.docker.internal
  STOCK_DATABASE_PORT: "5432"
  STOCK_DATABASE_USER: stock_user
  STOCK_DATABASE_NAME: stock
  STOCK_AUTH_MODE: none
  STOCK_ALLOW_SIGNUP: "false"
  STOCK_FRONTEND_URL: ""
  STOCK_LOGS_DIR: /app/logs
  # openKMS integration (optional). The webhook secret and API key live in stock-secrets.
  STOCK_OPENKMS_BASE_URL: http://host.docker.internal:8102
  STOCK_OPENKMS_NEO4J_DATA_SOURCE_ID: ee7b2787-8d88-4a37-9213-96b40ce29025
  # Types the ontology mirrors; refreshed after a finished run or an applied portfolio change.
  STOCK_OPENKMS_REINDEX: >-
    [{"kind":"object_type","id":"5620a6b1-761f-4ccd-b673-6f968fcfb35e","prune":true},
     {"kind":"link_type","id":"11dbcb42-90e5-4bdf-b525-1e3e2ae2536b","prune":true},
     {"kind":"object_type","id":"6b6a7d30-201f-4cf5-8bcb-d0b33be9a193","prune":true},
     {"kind":"link_type","id":"4c139eb1-b9bb-4b70-88ac-b722a16de9dc","prune":true},
     {"kind":"link_type","id":"fba889fa-0d82-4a84-8526-79f5a40c62d8","prune":true}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: stock
  labels:
    app: backend
    app.kubernetes.io/part-of: turtle
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: turtle-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8200
              name: http
          envFrom:
            - configMapRef:
                name: stock-config
            - secretRef:
                name: stock-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: logs
              mountPath: /app/logs
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: stock
  labels:
    app: backend
    app.kubernetes.io/part-of: turtle
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8200
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: stock
  labels:
    app: frontend
    app.kubernetes.io/part-of: turtle
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        # Vite DevServer — VITE_BASE must match the Apps module proxy URL
        # (`/api/app-builder/apps/<appId>/proxy/`), NOT the internal k8s path.
        # Hot deploy: kubernetes dev-sync → POST /-/reload (WebSocket HMR not proxied).
        - name: frontend
          image: turtle-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3200
              name: http
          env:
            - name: VITE_BASE
              value: /api/app-builder/apps/oa-b15fa78073c0/proxy/
            - name: VITE_PROXY_TARGET
              value: http://backend:8200
            - name: VITE_HMR
              value: "false"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: stock
  labels:
    app: frontend
    app.kubernetes.io/part-of: turtle
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 3200
      targetPort: http
