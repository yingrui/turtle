server {
    listen 3200;
    server_name localhost;
    root /usr/share/nginx/html;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    location /api/ {
        proxy_pass http://backend:8200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # openKMS Service proxy identity (forwarded on every proxied request)
        proxy_set_header X-Openkms-User-Id $http_x_openkms_user_id;
        proxy_set_header X-Openkms-Username $http_x_openkms_username;
        proxy_set_header X-Openkms-User-Name $http_x_openkms_user_name;
        proxy_set_header X-Openkms-User-Email $http_x_openkms_user_email;
        proxy_set_header X-Openkms-User-Admin $http_x_openkms_user_admin;
        proxy_read_timeout 300s;
    }

    location /health {
        proxy_pass http://backend:8200;
        proxy_set_header Host $host;
        proxy_set_header X-Openkms-User-Id $http_x_openkms_user_id;
        proxy_set_header X-Openkms-Username $http_x_openkms_username;
        proxy_set_header X-Openkms-User-Name $http_x_openkms_user_name;
        proxy_set_header X-Openkms-User-Email $http_x_openkms_user_email;
        proxy_set_header X-Openkms-User-Admin $http_x_openkms_user_admin;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
